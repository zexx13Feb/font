    <!-- Google Fonts Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent-color: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --accent-border: rgba(168, 85, 247, 0.2);
            --accent-hover: rgba(147, 51, 234, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #040208;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .heading-font {
            font-family: 'Outfit', sans-serif;
        }

        /* Dynamic Theme Styles */
        .theme-accent-text { color: var(--accent-color); }
        .theme-accent-border { border-color: var(--accent-border); }
        .theme-accent-bg { background-color: var(--accent-color); }

        /* Glassmorphism Cards & Elements */
        .glass-card {
            background: rgba(12, 8, 24, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--accent-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--accent-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: var(--accent-hover);
            border-color: var(--accent-color);
            box-shadow: 0 0 25px var(--accent-glow);
            transform: translateY(-2px);
        }

        .glass-button:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Avatar Deep Glow Animation */
        .avatar-glow {
            border-color: var(--accent-color);
            box-shadow: 0 0 25px var(--accent-glow);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px var(--accent-glow);
            }
            100% {
                box-shadow: 0 0 35px var(--accent-color);
            }
        }

        /* Cyber Glitch Effect for Profile Name */
        .glitch {
            position: relative;
            color: #ffffff;
            letter-spacing: 1.5px;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .glitch::before {
            left: -2px;
            text-shadow: 2px 0 var(--accent-color);
            animation: glitch-anim-1 2.2s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: 2px;
            text-shadow: -2px 0 #6366f1;
            animation: glitch-anim-2 3.1s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 15px, 0); }
            20% { clip: rect(42px, 9999px, 78px, 0); }
            40% { clip: rect(10px, 9999px, 85px, 0); }
            60% { clip: rect(65px, 9999px, 30px, 0); }
            80% { clip: rect(3px, 9999px, 90px, 0); }
            100% { clip: rect(50px, 9999px, 10px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(70px, 9999px, 5px, 0); }
            20% { clip: rect(12px, 9999px, 60px, 0); }
            40% { clip: rect(85px, 9999px, 10px, 0); }
            60% { clip: rect(25px, 9999px, 95px, 0); }
            80% { clip: rect(40px, 9999px, 18px, 0); }
            100% { clip: rect(5px, 9999px, 75px, 0); }
        }

        /* Full Screen Backdrop Blur Container Filter */
        #mainContent {
            transition: filter 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        .full-screen-blur {
            filter: blur(16px) brightness(0.5);
            pointer-events: none;
            user-select: none;
        }

        /* Backdrop Overlay Curtain */
        .modal-curtain {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in-out;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-curtain.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            background-color: var(--accent-glow);
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Audio Equalizer Bars */
        .eq-bar {
            width: 3px;
            height: 12px;
            background-color: var(--accent-color);
            border-radius: 2px;
            animation: bounce 0.8s infinite ease-in-out alternate;
        }

        .eq-bar:nth-child(1) { animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { animation-delay: 0.4s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        .paused .eq-bar {
            animation-play-state: paused;
            height: 4px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }
    </style>
</head>

    <script>
        // Audio Tracks Playlist (Gunakan URL fallback lofi online jika mp3 lokal tidak ditemukan)
        const playlist = [
            {
                title: "Jalan keluar",
                artist: "Nuca",
                url: "jalankeluar.mp3"
            },
            {
                title: "Breathe",
                artist: "Lofi Beats",
                url: "breathe.mp3"
            },
            {
                title: "Flat line",
                artist: "Jb",
                url: "flatlinefull.mp3"
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;

        // Audio Object Setup
        const audio = new Audio();
        audio.src = playlist[currentTrackIndex].url;
        audio.volume = 0.8;

        // DOM Elements
        const eqIcon = document.getElementById('eqIcon');
        const playBtnIcon = document.getElementById('playBtnIcon');
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const volumeControl = document.getElementById('volumeControl');
        const playlistContainer = document.getElementById('playlistContainer');
        const musicModal = document.getElementById('musicModal');
        const optionsModal = document.getElementById('optionsModal');
        const modalCurtain = document.getElementById('modalCurtain');
        const mainContent = document.getElementById('mainContent');
        const discIcon = document.getElementById('discIcon');
        const bgVideo = document.getElementById('bgVideo');

        // Handling Audio Load Error (Misal file MP3 lokal belum di-upload di folder yang sama)
        audio.addEventListener('error', (e) => {
            if (isPlaying) {
                isPlaying = false;
                updatePlayerUI();
                showToast(`File "${playlist[currentTrackIndex].url}" tidak ditemukan! Pasang file mp3 di folder kodenya.`);
            }
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const isCurrent = index === currentTrackIndex;
                const trackEl = document.createElement('div');
                trackEl.className = `flex items-center justify-between p-2 rounded-xl cursor-pointer text-xs transition duration-200 ${
                    isCurrent ? 'bg-purple-600/30 text-purple-300 font-semibold border border-purple-500/40' : 'hover:bg-white/5 text-gray-300'
                }`;
                trackEl.onclick = () => selectTrack(index);
                trackEl.innerHTML = `
                    <div class="flex items-center space-x-2.5 truncate">
                        <i class="fa-solid ${isCurrent && isPlaying ? 'fa-volume-high theme-accent-text animate-pulse' : 'fa-music theme-accent-text'}"></i>
                        <span class="truncate">${track.title}</span>
                    </div>
                    <span class="text-[10px] text-gray-400 font-mono">${track.artist}</span>
                `;
                playlistContainer.appendChild(trackEl);
            });
        }

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                updatePlayerUI();
            } else {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        updatePlayerUI();
                    }).catch(err => {
                        isPlaying = false;
                        updatePlayerUI();
                        showToast("Gagal memutar audio. Pastikan file mp3 berada di folder HTML.");
                    });
                }
            }
        }

        function selectTrack(index) {
            currentTrackIndex = index;
            audio.src = playlist[currentTrackIndex].url;
            audio.currentTime = 0;
            isPlaying = true;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    updatePlayerUI();
                    showToast(`Lagu: ${playlist[currentTrackIndex].title}`);
                }).catch(() => {
                    isPlaying = false;
                    updatePlayerUI();
                    showToast(`File ${playlist[currentTrackIndex].url} tidak ditemukan.`);
                });
            }
        }

        function playNextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            selectTrack(currentTrackIndex);
        }

        function playPrevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            selectTrack(currentTrackIndex);
        }

        function updatePlayerUI() {
            currentTitle.innerText = playlist[currentTrackIndex].title;
            currentArtist.innerText = playlist[currentTrackIndex].artist || "Unknown Artist";

            if (isPlaying) {
                eqIcon.classList.remove('paused');
                playBtnIcon.className = "fa-solid fa-pause text-base";
                discIcon.classList.add('animate-spin');
            } else {
                eqIcon.classList.add('paused');
                playBtnIcon.className = "fa-solid fa-play text-base pl-0.5";
                discIcon.classList.remove('animate-spin');
            }
            renderPlaylist();
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isNaN(audio.duration)) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationTimeEl.innerText = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration && !isNaN(audio.duration)) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        volumeControl.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        audio.addEventListener('ended', () => {
            playNextTrack();
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Modal Management & Full Screen Blur
        let isMusicMenuOpen = false;
        let isOptionsMenuOpen = false;

        function applyFullScreenBlur(active) {
            if (active) {
                mainContent.classList.add('full-screen-blur');
                bgVideo.classList.add('blur-md');
                modalCurtain.classList.add('active');
            } else {
                mainContent.classList.remove('full-screen-blur');
                bgVideo.classList.remove('blur-md');
                modalCurtain.classList.remove('active');
            }
        }

        function closeAllModals() {
            isMusicMenuOpen = false;
            isOptionsMenuOpen = false;
            musicModal.classList.add('translate-y-full');
            optionsModal.classList.add('translate-y-full');
            applyFullScreenBlur(false);
        }

        function toggleMusicMenu() {
            if (isOptionsMenuOpen) {
                optionsModal.classList.add('translate-y-full');
                isOptionsMenuOpen = false;
            }

            isMusicMenuOpen = !isMusicMenuOpen;
            if (isMusicMenuOpen) {
                musicModal.classList.remove('translate-y-full');
                applyFullScreenBlur(true);
            } else {
                musicModal.classList.add('translate-y-full');
                applyFullScreenBlur(false);
            }
        }

        function toggleOptionsMenu() {
            if (isMusicMenuOpen) {
                musicModal.classList.add('translate-y-full');
                isMusicMenuOpen = false;
            }

            isOptionsMenuOpen = !isOptionsMenuOpen;
            if (isOptionsMenuOpen) {
                optionsModal.classList.remove('translate-y-full');
                applyFullScreenBlur(true);
            } else {
                optionsModal.classList.add('translate-y-full');
                applyFullScreenBlur(false);
            }
        }

        // Dynamic Theme Color Switcher
        function setThemeColor(colorHex) {
            document.documentElement.style.setProperty('--accent-color', colorHex);
            document.documentElement.style.setProperty('--accent-glow', colorHex + '80');
            document.documentElement.style.setProperty('--accent-border', colorHex + '33');
            document.documentElement.style.setProperty('--accent-hover', colorHex + '26');
            showToast("Warna tema berhasil diperbarui!");
        }

        // Custom Background Video via URL
        function applyVideoUrl() {
            const url = document.getElementById('videoUrlInput').value.trim();
            if (url) {
                bgVideo.src = url;
                bgVideo.play();
                showToast("Background video diperbarui!");
            } else {
                showToast("Masukkan URL video yang valid!");
            }
        }

        // Custom Background Video via Local File Upload
        function handleVideoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                bgVideo.src = fileURL;
                bgVideo.play();
                showToast("Video lokal berhasil dipasang!");
            }
        }

        // Link Click & Ripple Effect Handler
        function handleLinkClick(event, name) {
            const button = event.currentTarget;
            
            const circle = document.createElement('span');
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            const rect = button.getBoundingClientRect();

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            const ripple = button.getElementsByClassName('ripple')[0];
            if (ripple) {
                ripple.remove();
            }

            button.appendChild(circle);
            showToast(`Membuka ${name}...`);
        }

        // Toast Popup Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.innerText = message;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2500);
        }

        window.onload = function() {
            renderPlaylist();
        };
    </script>
</body>
</html>
