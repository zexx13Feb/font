<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social Zexx</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            color: white;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           VIDEO BACKGROUND
        ========================= */

        .video-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            background: #050505;
        }

        .video-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 0, 0, 0.58),
                    rgba(0, 0, 0, 0.20),
                    rgba(0, 0, 0, 0.65)
                );
        }

        .video-blur {
            position: fixed;
            inset: -30px;
            z-index: -1;

            backdrop-filter: blur(1.5px);
            -webkit-backdrop-filter: blur(1.5px);
        }

        /* =========================
           LIQUID GLASS CARD
        ========================= */

        .card {
            position: relative;

            width: min(92%, 390px);
            max-height: 94vh;
            overflow: auto;

            padding: 28px 24px 20px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.16),
                    rgba(255, 255, 255, 0.055)
                );

            border: 1px solid rgba(255, 255, 255, 0.23);
            border-radius: 30px;

            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 1px rgba(255, 255, 255, 0.28),
                inset 0 -1px 1px rgba(255, 255, 255, 0.05);

            animation: cardIn 1s cubic-bezier(.16, 1, .3, 1);
        }

        /* Liquid glass shine */

        .card::before {
            content: "";
            position: absolute;

            top: -40%;
            left: -20%;

            width: 140%;
            height: 70%;

            background:
                linear-gradient(
                    120deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.12),
                    transparent 70%
                );

            transform: rotate(-8deg);
            pointer-events: none;
        }

        .card::after {
            content: "";

            position: absolute;
            inset: 0;

            border-radius: inherit;

            background:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(255, 255, 255, 0.18),
                    transparent 30%
                );

            pointer-events: none;
        }

        .card::-webkit-scrollbar {
            width: 0;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.94);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* =========================
           PROFILE
        ========================= */

        .profile-wrapper {
            position: relative;
            width: 108px;
            height: 108px;
            margin: 0 auto 12px;
        }

        .profile-wrapper::before {
            content: "";

            position: absolute;
            inset: -5px;

            border-radius: 50%;

            background:
                conic-gradient(
                    #ff006a,
                    #7b2cff,
                    #00d4ff,
                    #ff006a
                );

            animation: rotateBorder 5s linear infinite;

            filter: blur(2px);
        }

        .profile-wrapper img {
            position: relative;

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                0 8px 35px rgba(0, 0, 0, .45);
        }

        @keyframes rotateBorder {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           NAME
        ========================= */

        .card h2 {
            margin: 12px 0 5px;

            font-size: 28px;
            font-weight: 800;
            letter-spacing: .3px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ff62c6,
                    #a66cff,
                    #55d9ff,
                    #ffffff
                );

            background-size: 300%;

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation: nameGradient 6s linear infinite;
        }

        @keyframes nameGradient {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        .verified {
            color: #55c7ff;

            -webkit-text-fill-color: #55c7ff;

            filter:
                drop-shadow(0 0 5px rgba(85, 199, 255, .65));
        }

        .description {
            margin: 3px 0;

            color: rgba(255, 255, 255, .72);

            font-size: 14px;
        }

        #tek {
            min-height: 20px;

            margin: 4px 0 15px;

            color: rgba(255, 255, 255, .9);

            font-size: 14px;
        }

        #tek::after {
            content: "|";

            margin-left: 2px;

            animation: blink .7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* =========================
           SOCIAL LINKS
        ========================= */

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 10px;

            position: relative;
            z-index: 2;
        }

        .social-links a {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 48px;

            padding: 12px 15px;

            color: white;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, .13),
                    rgba(255, 255, 255, .045)
                );

            border: 1px solid rgba(255, 255, 255, .14);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                inset 0 1px 1px rgba(255,255,255,.12),
                0 5px 20px rgba(0,0,0,.15);

            overflow: hidden;

            transition:
                transform .25s ease,
                background .25s ease,
                box-shadow .25s ease;
        }

        .social-links a::before {
            content: "";

            position: absolute;
            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    100deg,
                    transparent,
                    rgba(255,255,255,.20),
                    transparent
                );

            transform: skewX(-20deg);

            transition: .5s;
        }

        .social-links a:hover::before {
            left: 130%;
        }

        .social-links a:hover {
            transform: translateY(-3px) scale(1.015);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.20),
                    rgba(255,255,255,.07)
                );

            box-shadow:
                0 10px 30px rgba(0,0,0,.30),
                inset 0 1px 1px rgba(255,255,255,.2);
        }

        .social-links a:active {
            transform: scale(.97);
        }

        .social-links i {
            position: absolute;
            left: 18px;

            width: 20px;

            font-size: 18px;
        }

        /* Hover colors */

        .github:hover {
            box-shadow:
                0 0 25px rgba(255,255,255,.12);
        }

        .instagram:hover {
            box-shadow:
                0 0 25px rgba(225,48,108,.35);
        }

        .telegram:hover {
            box-shadow:
                0 0 25px rgba(0,136,204,.35);
        }

        .email:hover {
            box-shadow:
                0 0 25px rgba(234,67,53,.35);
        }

        .whatsapp:hover {
            box-shadow:
                0 0 25px rgba(37,211,102,.35);
        }

        /* =========================
           DATE
        ========================= */

        #tanggal {
            margin: 15px 0 2px;

            color: rgba(255,255,255,.5);

            font-size: 10px;
            font-weight: normal;
        }

        /* =========================
           MUSIC BUTTON
        ========================= */

        .music-button {
            position: fixed;

            right: 18px;
            bottom: 18px;

            width: 46px;
            height: 46px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,.25);

            background:
                rgba(255,255,255,.12);

            color: white;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 8px 30px rgba(0,0,0,.3);

            cursor: pointer;

            z-index: 10;

            transition: .25s;
        }

        .music-button:hover {
            transform: scale(1.08);
            background: rgba(255,255,255,.2);
        }

        .music-button.playing {
            animation: musicPulse 1.5s infinite;
        }

        @keyframes musicPulse {
            50% {
                box-shadow:
                    0 0 0 8px rgba(255,255,255,.03),
                    0 0 30px rgba(180,120,255,.4);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .card {
                width: calc(100% - 28px);
                padding: 24px 18px 17px;

                border-radius: 26px;
            }

            .profile-wrapper {
                width: 92px;
                height: 92px;
            }

            .card h2 {
                font-size: 24px;
            }

            .social-links a {
                min-height: 46px;
                font-size: 13px;
            }

            #tanggal {
                font-size: 9px;
            }
        }

        @media (max-height: 650px) {
            .card {
                padding-top: 16px;
                padding-bottom: 12px;
            }

            .profile-wrapper {
                width: 75px;
                height: 75px;
            }

            .card h2 {
                margin: 7px 0 3px;
                font-size: 22px;
            }

            #tek {
                margin-bottom: 8px;
            }

            .social-links {
                gap: 7px;
            }

            .social-links a {
                min-height: 40px;
                padding: 8px;
            }

            #tanggal {
                margin-top: 8px;
            }
        }
    </style>
</head>

    <script>

        /* =========================
           DATE & TIME
        ========================== */

        function tampilTanggal() {

            const tanggal = new Date();

            const hari = [
                "Minggu",
                "Senin",
                "Selasa",
                "Rabu",
                "Kamis",
                "Jumat",
                "Sabtu"
            ];

            const bulan = [
                "Januari",
                "Februari",
                "Maret",
                "April",
                "Mei",
                "Juni",
                "Juli",
                "Agustus",
                "September",
                "Oktober",
                "November",
                "Desember"
            ];

            const tahun = tanggal.getFullYear();

            const jam =
                tanggal.getHours()
                    .toString()
                    .padStart(2, "0");

            const menit =
                tanggal.getMinutes()
                    .toString()
                    .padStart(2, "0");

            const detik =
                tanggal.getSeconds()
                    .toString()
                    .padStart(2, "0");

            document.getElementById("tanggal").innerHTML =
                `${hari[tanggal.getDay()]}, ${tanggal.getDate()} ${bulan[tanggal.getMonth()]} ${tahun} - ${jam}:${menit}:${detik}`;
        }

        tampilTanggal();

        setInterval(
            tampilTanggal,
            1000
        );


        /* =========================
           TYPEWRITER
        ========================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const dataText = [
                    "developer and programmer",
                    "gamer",
                    "coder",
                    "hacker! 😈",
                    "just kidding"
                ];

                const element =
                    document.getElementById("tek");

                let textIndex = 0;
                let charIndex = 0;
                let deleting = false;

                function typeWriter() {

                    const currentText =
                        dataText[textIndex];

                    if (!deleting) {

                        element.textContent =
                            currentText.substring(
                                0,
                                charIndex + 1
                            );

                        charIndex++;

                        if (
                            charIndex ===
                            currentText.length
                        ) {

                            deleting = true;

                            setTimeout(
                                typeWriter,
                                1800
                            );

                            return;
                        }

                    } else {

                        element.textContent =
                            currentText.substring(
                                0,
                                charIndex - 1
                            );

                        charIndex--;

                        if (charIndex === 0) {

                            deleting = false;

                            textIndex =
                                (textIndex + 1)
                                % dataText.length;
                        }
                    }

                    setTimeout(
                        typeWriter,
                        deleting ? 45 : 80
                    );
                }

                typeWriter();
            }
        );


        /* =========================
           MUSIC
        ========================== */

        const music =
            document.getElementById("bgMusic");

        const musicButton =
            document.getElementById("musicButton");

        const musicIcon =
            musicButton.querySelector("i");


        function musicOn() {

            music.play()
                .then(() => {

                    musicButton.classList.add(
                        "playing"
                    );

                    musicIcon.className =
                        "fas fa-volume-up";

                })
                .catch(() => {

                    musicIcon.className =
                        "fas fa-volume-mute";
